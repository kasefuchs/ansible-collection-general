# Version of Tailscale to download.
# renovate: datasource=github-releases depName=tailscale/tailscale
tailscale_download_version: "1.102.4"

# Mapping from system architecture to Tailscale release architecture naming.
tailscale_download_architecture_map:
  x86_64: amd64
  aarch64: arm64

# URL to download the Tailscale archive.
tailscale_download_url: "https://pkgs.tailscale.com/stable/tailscale_{{ download_url_version }}_{{ arch.value }}.tgz"
