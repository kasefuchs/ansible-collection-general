- name: Download Nebula archive
  ansible.builtin.include_role:
    name: kasefuchs.general.download_url
  vars:
    download_url_dir: "{{ nebula_download_local_dir }}"
    download_url_source: "{{ nebula_download_url }}"
    download_url_version: "{{ nebula_download_version }}"
    download_url_architecture_map: "{{ nebula_download_architecture_map }}"
