# Version of Nebula to download.
# renovate: datasource=github-releases depName=slackhq/nebula
nebula_download_version: "1.11.1"

# Mapping from system architecture to Nebula release architecture naming.
nebula_download_architecture_map:
  x86_64: amd64
  aarch64: arm64

# URL to download the Nebula archive.
nebula_download_url: "https://github.com/slackhq/nebula/releases/download/v{{ download_url_version }}/nebula-linux-{{ arch.value }}.tar.gz"
