- name: Link current version directory
  block:
    - name: Create version directory
      ansible.builtin.file:
        path: "{{ download_url_current_dir }}"
        mode: "0755"
        state: directory

    - name: Link current version directory
      ansible.builtin.file:
        src: "{{ download_url_current_dir }}"
        dest: "{{ download_url_current_dir_link }}"
        state: link

- name: Download files
  block:
    - name: Check if files already downloaded
      loop: "{{ download_url_architecture_map | dict2items }}"
      register: download_url_files
      loop_control:
        label: "{{ arch.key }}"
        loop_var: arch
      ansible.builtin.stat:
        path: "{{ (download_url_current_dir_link, arch.key) | path_join }}"

    - name: Download files
      when:
        - not download_url_files.results[ansible_loop.index0].stat.exists
        - arch.key in download_url_unique_architectures
      loop: "{{ download_url_architecture_map | dict2items }}"
      loop_control:
        label: "{{ arch.key }}"
        loop_var: arch
        extended: true
      ansible.builtin.get_url:
        url: "{{ download_url_source }}"
        dest: "{{ (download_url_current_dir_link, arch.key) | path_join }}"
        mode: "0644"
